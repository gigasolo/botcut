<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shots</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  #sidebar { transition: width 0.18s ease; }
  #sidebar.collapsed { width: 64px; }
  #sidebar.collapsed .sidebar-label,
  #sidebar.collapsed #wordmark,
  #sidebar.collapsed #account-meta,
  #sidebar.collapsed #kbd-hint,
  #sidebar.collapsed #sidebar-brand-text { display: none; }
  #sidebar.collapsed #sidebar-brand { justify-content: center; padding-left: 0; padding-right: 0; }
  #sidebar.collapsed #nav-shots,
  #sidebar.collapsed #nav-watch,
  #sidebar.collapsed #help-btn,
  #sidebar.collapsed #settings-btn,
  #sidebar.collapsed #account-switcher { justify-content: center; padding-left: 0; padding-right: 0; }
  #sidebar.collapsed #collapse-toggle i { transform: rotate(180deg); }
  #drop-zone.drag-active { border-color: #FFD60A; background-color: rgba(255,214,10,0.05); }
  @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(255,214,10,0.25); } 100% { box-shadow: 0 0 0 10px rgba(255,214,10,0); } }
  #upload-icon-wrap { animation: pulse-ring 2.4s ease-out infinite; }
</style>
</head>
<body class="bg-[#0e0e10]">

<div id="app" class="w-full bg-[#0e0e10] flex h-[1024px]">

  <!-- Sidebar: wordmark + nav + settings/help + account, replaces top app bar + tab row -->
  <aside id="sidebar" class="w-[212px] shrink-0 bg-[#1c1c1e] border-r border-[#2c2c2f] flex flex-col h-full relative">

    <div id="sidebar-brand" class="h-[52px] shrink-0 flex items-center justify-between px-5 border-b border-[#2c2c2f]">
      <div id="wordmark-group" class="flex items-center gap-2 min-w-0">
        <div id="brand-mark" class="w-5 h-5 rounded-[5px] bg-[#FFD60A] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-scissors text-[#0e0e10] text-[10px]"></i>
        </div>
        <div id="wordmark" class="text-[#f4f4f5] text-[14px] font-semibold truncate">BotCut</div>
      </div>
      <button id="collapse-toggle" class="w-6 h-6 rounded-md flex items-center justify-center text-[#7a7a80] hover:bg-[#2a2a2e] hover:text-[#f4f4f5] transition-colors shrink-0">
        <i class="fa-solid fa-chevron-left text-[11px] transition-transform"></i>
      </button>
    </div>

    <nav id="sidebar-nav" class="flex-1 flex flex-col gap-1 px-3 pt-4">
      <div id="nav-shots" tabindex="0" class="flex items-center gap-3 px-3 py-2.5 rounded-md bg-[#2a2a2e] text-[#f4f4f5] text-[13px] font-medium relative cursor-pointer transition-colors hover:bg-[#333336] active:bg-[#3a3a3e] focus:outline-none focus:ring-1 focus:ring-[#FFD60A]/60">
        <span class="absolute left-0 top-1.5 bottom-1.5 w-[3px] bg-[#FFD60A] rounded-full"></span>
        <i class="fa-solid fa-clapperboard text-[13px] w-4 text-center shrink-0"></i>
        <span class="sidebar-label flex-1">Shots</span>
      </div>
      <div id="nav-watch" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-[#5a5a60] text-[13px] cursor-not-allowed">
        <i class="fa-solid fa-play text-[13px] w-4 text-center shrink-0"></i>
        <span class="sidebar-label flex-1">Watch</span>
        <i class="fa-solid fa-lock text-[9px] text-[#4a4a50] sidebar-label"></i>
      </div>

      <div id="nav-section-divider" class="h-px bg-[#2c2c2f] my-3 mx-1"></div>

      <div id="kbd-hint" class="px-3 py-2.5 rounded-md bg-[#232325] border border-[#2c2c2f]">
        <div class="flex items-center gap-2 text-[#b8b8bc] text-[11.5px] leading-snug">
          <i class="fa-regular fa-lightbulb text-[#FFD60A] text-[11px] mt-[1px] shrink-0"></i>
          <span>Drop clips anywhere to start a new cut</span>
        </div>
      </div>
    </nav>

    <div id="sidebar-footer" class="shrink-0 px-3 pb-3 flex flex-col gap-1 border-t border-[#2c2c2f] pt-3">
      <button id="help-btn" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-[#b8b8bc] text-[13px] transition-colors hover:bg-[#2a2a2e] hover:text-[#f4f4f5] active:bg-[#333336] text-left focus:outline-none focus:ring-1 focus:ring-[#FFD60A]/60">
        <span class="w-4 h-4 rounded-full border border-[#5a5a60] text-[9px] flex items-center justify-center shrink-0">?</span>
        <span class="sidebar-label flex-1">Help</span>
        <span class="sidebar-label text-[10.5px] text-[#5a5a60]">⌘/</span>
      </button>
      <button id="settings-btn" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-[#b8b8bc] text-[13px] transition-colors hover:bg-[#2a2a2e] hover:text-[#f4f4f5] active:bg-[#333336] text-left focus:outline-none focus:ring-1 focus:ring-[#FFD60A]/60">
        <i class="fa-solid fa-gear text-[13px] w-4 text-center shrink-0"></i>
        <span class="sidebar-label flex-1">Settings</span>
      </button>
    </div>

    <!-- Account switcher -->
    <div id="account-switcher-wrap" class="shrink-0 px-3 pb-3 border-t border-[#2c2c2f] pt-3 relative">
      <button id="account-switcher" class="w-full flex items-center gap-2.5 px-2 py-2 rounded-md transition-colors hover:bg-[#2a2a2e] active:bg-[#333336] focus:outline-none focus:ring-1 focus:ring-[#FFD60A]/60">
        <img id="account-avatar" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" class="w-7 h-7 rounded-full shrink-0 object-cover ring-1 ring-[#2c2c2f]" />
        <div id="account-meta" class="flex flex-col items-start min-w-0 flex-1">
          <span id="account-name" class="text-[#f4f4f5] text-[12.5px] font-medium truncate w-full text-left">Marcus Reyes</span>
          <span id="account-sub" class="text-[#7a7a80] text-[11px] truncate w-full text-left flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-[#5a5a60] inline-block"></span>Free plan
          </span>
        </div>
        <i class="fa-solid fa-chevron-up text-[#7a7a80] text-[10px] shrink-0"></i>
      </button>
    </div>
  </aside>

  <!-- Right column: content + footer stacked, more vertical room since no top bars -->
  <div id="content-column" class="flex-1 flex flex-col min-w-0">

    <!-- Main content -->
    <main id="main-content" class="flex-1 flex flex-col items-center justify-center px-10 overflow-hidden">
      <div id="empty-state" class="w-full max-w-[600px] flex flex-col items-center">

        <div id="drop-zone" class="w-full h-[440px] border-2 border-dashed border-[#2c2c2f] rounded-xl bg-[#17171a] flex flex-col items-center justify-center gap-5 transition-colors cursor-pointer group hover:border-[#3a3a3e] hover:bg-[#1a1a1d]">

          <div id="upload-icon-wrap" class="w-20 h-20 rounded-full bg-[#1c1c1e] border border-[#2c2c2f] flex items-center justify-center shrink-0 group-hover:border-[#FFD60A]/40 transition-colors">
            <i class="fa-solid fa-film text-[30px] text-[#FFD60A]"></i>
          </div>

          <div class="flex flex-col items-center gap-2">
            <div id="drop-zone-title" class="text-[#f4f4f5] text-[20px] font-semibold tracking-tight">Drop your shots here</div>
            <div id="drop-zone-sub" class="text-[#8b8b90] text-[13.5px]">MP4, MOV, or MKV &middot; straight from your phone or camera</div>
          </div>

          <button id="add-videos-btn" class="mt-1 bg-[#FFD60A] text-[#0e0e10] text-[14px] font-semibold px-7 py-2.5 rounded-lg transition-all duration-150 hover:bg-[#ffde33] hover:shadow-[0_8px_22px_-6px_rgba(255,214,10,0.5)] active:bg-[#e0bd00] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-[#FFD60A]/40 focus:ring-offset-2 focus:ring-offset-[#17171a] flex items-center gap-2">
            <i class="fa-solid fa-plus text-[12px]"></i>
            Add videos
          </button>

          <div id="browse-hint" class="text-[#5a5a60] text-[11.5px]">or press <span class="mono text-[#7a7a80]">⌘O</span> to browse files</div>
        </div>

        <!-- Quick facts row -->
        <div id="quick-facts" class="w-full grid grid-cols-3 gap-3 mt-6">
          <div class="flex flex-col items-center gap-1.5 px-3 py-3 rounded-lg bg-[#17171a] border border-[#232325]">
            <i class="fa-solid fa-wand-magic-sparkles text-[#FFD60A] text-[13px]"></i>
            <span class="text-[#b8b8bc] text-[11.5px] text-center leading-snug">Auto-finds your best lines</span>
          </div>
          <div class="flex flex-col items-center gap-1.5 px-3 py-3 rounded-lg bg-[#17171a] border border-[#232325]">
            <i class="fa-solid fa-scissors text-[#FFD60A] text-[13px]"></i>
            <span class="text-[#b8b8bc] text-[11.5px] text-center leading-snug">Cuts silence &amp; dead air</span>
          </div>
          <div class="flex flex-col items-center gap-1.5 px-3 py-3 rounded-lg bg-[#17171a] border border-[#232325]">
            <i class="fa-solid fa-download text-[#FFD60A] text-[13px]"></i>
            <span class="text-[#b8b8bc] text-[11.5px] text-center leading-snug">Exports ready to post</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer id="footer" class="h-[64px] shrink-0 border-t border-[#2c2c2f] bg-[#1c1c1e] flex items-center justify-between px-6">
      <div id="status-line" class="mono text-[#5a5a60] text-[12px] flex items-center gap-2">
        <i class="fa-regular fa-circle text-[8px]"></i>
        No shots yet
      </div>
      <button id="cut-btn" class="bg-[#2a2a2e] text-[#5a5a60] text-[14px] font-medium px-6 py-2.5 rounded-md cursor-not-allowed" disabled>Cut</button>
    </footer>
  </div>

</div>

<script>
  const sidebar = document.getElementById('sidebar');
  const collapseToggle = document.getElementById('collapse-toggle');

  collapseToggle.addEventListener('click', function () {
    sidebar.classList.toggle('collapsed');
  });

  const accountSwitcher = document.getElementById('account-switcher');
  accountSwitcher.addEventListener('click', function () {
    accountSwitcher.classList.toggle('bg-[#2a2a2e]');
  });

  const dropZone = document.getElementById('drop-zone');
  ['dragenter', 'dragover'].forEach(evt => {
    dropZone.addEventListener(evt, function (e) {
      e.preventDefault();
      dropZone.classList.add('drag-active');
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    dropZone.addEventListener(evt, function (e) {
      e.preventDefault();
      dropZone.classList.remove('drag-active');
    });
  });
</script>

</body>
</html>
