<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Close</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  #sidebar { transition: width 0.18s ease; }
  #sidebar.collapsed { width: 64px; }
  #sidebar.collapsed .sidebar-label,
  #sidebar.collapsed #wordmark,
  #sidebar.collapsed #account-meta,
  #sidebar.collapsed #sidebar-brand-text { display: none; }
  #sidebar.collapsed #sidebar-brand,
  #sidebar.collapsed #wordmark-group { justify-content: center; padding-left: 0; padding-right: 0; }
  #sidebar.collapsed #nav-shots,
  #sidebar.collapsed #nav-watch,
  #sidebar.collapsed #help-btn,
  #sidebar.collapsed #settings-btn,
  #sidebar.collapsed #account-switcher { justify-content: center; padding-left: 0; padding-right: 0; }
  #sidebar.collapsed #collapse-toggle i { transform: rotate(180deg); }
</style>
</head>
<body class="bg-[#0e0e10]">

<div id="app" class="w-full bg-[#0e0e10] flex h-[1024px] relative overflow-hidden">

  <aside id="sidebar" class="w-[212px] shrink-0 bg-[#1c1c1e] border-r border-[#2c2c2f] flex flex-col h-full relative">

    <div id="sidebar-brand" class="h-[52px] shrink-0 flex items-center justify-between px-5 border-b border-[#2c2c2f]">
      <div id="wordmark-group" class="flex items-center gap-2 min-w-0">
        <div id="brand-mark" class="w-5 h-5 rounded-[5px] bg-[#FFD60A] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-scissors text-[#0e0e10] text-[10px]"></i>
        </div>
        <div id="wordmark" class="text-[#f4f4f5] text-[14px] font-semibold truncate">BotCut</div>
      </div>
      <button id="collapse-toggle" class="w-6 h-6 rounded-md flex items-center justify-center text-[#7a7a80] hover:bg-[#2a2a2e] hover:text-[#f4f4f5] transition-colors shrink-0">
        <i class="fa-solid fa-chevron-left text-[11px] transition-transform"></i>
      </button>
    </div>

    <nav id="sidebar-nav" class="flex-1 flex flex-col gap-1 px-3 pt-4">
      <div id="nav-shots" tabindex="0" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-[#b8b8bc] text-[13px] cursor-pointer transition-colors hover:bg-[#2a2a2e] hover:text-[#f4f4f5] active:bg-[#333336] focus:outline-none focus:ring-1 focus:ring-[#FFD60A]/60">
        <i class="fa-solid fa-clapperboard text-[13px] w-4 text-center shrink-0"></i>
        <span class="sidebar-label flex-1">Shots</span>
      </div>
      <div id="nav-watch" tabindex="0" class="flex items-center gap-3 px-3 py-2.5 rounded-md bg-[#2a2a2e] text-[#f4f4f5] text-[13px] font-medium relative cursor-pointer transition-colors hover:bg-[#333336] active:bg-[#3a3a3e] focus:outline-none focus:ring-1 focus:ring-[#FFD60A]/60">
        <span class="absolute left-0 top-1.5 bottom-1.5 w-[3px] bg-[#FFD60A] rounded-full"></span>
        <i class="fa-solid fa-play text-[13px] w-4 text-center shrink-0"></i>
        <span class="sidebar-label flex-1">Watch</span>
      </div>
    </nav>

    <div id="sidebar-footer" class="shrink-0 px-3 pb-3 flex flex-col gap-1 border-t border-[#2c2c2f] pt-3">
      <button id="help-btn" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-[#b8b8bc] text-[13px] transition-colors hover:bg-[#2a2a2e] hover:text-[#f4f4f5] active:bg-[#333336] text-left focus:outline-none focus:ring-1 focus:ring-[#FFD60A]/60">
        <span class="w-4 h-4 rounded-full border border-[#5a5a60] text-[9px] flex items-center justify-center shrink-0">?</span>
        <span class="sidebar-label flex-1">Help</span>
        <span class="sidebar-label text-[10.5px] text-[#5a5a60]">⌘/</span>
      </button>
      <button id="settings-btn" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-[#b8b8bc] text-[13px] transition-colors hover:bg-[#2a2a2e] hover:text-[#f4f4f5] active:bg-[#333336] text-left focus:outline-none focus:ring-1 focus:ring-[#FFD60A]/60">
        <i class="fa-solid fa-gear text-[13px] w-4 text-center shrink-0"></i>
        <span class="sidebar-label flex-1">Settings</span>
      </button>
    </div>

    <div id="account-switcher-wrap" class="shrink-0 px-3 pb-3 border-t border-[#2c2c2f] pt-3 relative">
      <button id="account-switcher" class="w-full flex items-center gap-2.5 px-2 py-2 rounded-md transition-colors hover:bg-[#2a2a2e] active:bg-[#333336] focus:outline-none focus:ring-1 focus:ring-[#FFD60A]/60">
        <img id="account-avatar" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" class="w-7 h-7 rounded-full shrink-0 object-cover ring-1 ring-[#2c2c2f]" />
        <div id="account-meta" class="flex flex-col items-start min-w-0 flex-1">
          <span id="account-name" class="text-[#f4f4f5] text-[12.5px] font-medium truncate w-full text-left">Marcus Reyes</span>
          <span id="account-sub" class="text-[#7a7a80] text-[11px] truncate w-full text-left flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-[#5a5a60] inline-block"></span>Free plan
          </span>
        </div>
        <i class="fa-solid fa-chevron-up text-[#7a7a80] text-[10px] shrink-0"></i>
      </button>
    </div>
  </aside>

  <div id="content-column" class="flex-1 flex flex-col min-w-0 relative">

  <main id="main-content" class="flex-1"></main>

  <!-- Scrim + Confirm card -->
  <div id="scrim" class="absolute inset-0 bg-[#0e0e10]/80 flex items-center justify-center">
    <div id="confirm-card" class="w-[400px] bg-[#1c1c1e] border border-[#2c2c2f] rounded-lg p-6">
      <div class="flex items-center gap-2 mb-3">
        <i class="fa-solid fa-triangle-exclamation text-[#e07a7a] text-[13px]"></i>
        <h2 id="confirm-title" class="text-[#f4f4f5] text-[16px] font-medium">Unexported edit</h2>
      </div>

      <!-- Clip thumbnail preview -->
      <div id="clip-preview" class="flex items-center gap-3 bg-[#161618] border border-[#2c2c2f] rounded-md p-2.5 mb-4">
        <div id="clip-thumb" class="w-[72px] h-[44px] shrink-0 bg-[#2a2a2e] rounded flex items-center justify-center relative overflow-hidden">
          <i class="fa-solid fa-play text-[#7a7a80] text-[12px]"></i>
          <span class="mono absolute bottom-0.5 right-1 text-[#f4f4f5] text-[9px] bg-[#0e0e10]/80 rounded px-1">2:31</span>
        </div>
        <div class="flex flex-col min-w-0">
          <span id="clip-name" class="text-[#f4f4f5] text-[13px] truncate">Rough cut &middot; trimmed by hand</span>
          <span id="clip-meta" class="mono text-[#7a7a80] text-[11px]">2:31 &middot; not yet exported</span>
        </div>
      </div>

      <p id="confirm-body" class="text-[#b8b8bc] text-[13px] leading-relaxed mb-4">You trimmed this movie by hand but haven&rsquo;t exported it yet. If you close now, that trim is lost &mdash; only the saved rough cut will still be here.</p>

      <!-- Don't show again -->
      <label id="dont-show-again-row" class="flex items-center gap-2.5 mb-5 cursor-pointer select-none">
        <input id="dont-show-again-checkbox" type="checkbox" class="w-4 h-4 rounded-sm bg-[#1c1c1e] border border-[#2c2c2f] accent-[#FFD60A]" />
        <span class="text-[#b8b8bc] text-[12px]">Don&rsquo;t show this again</span>
      </label>

      <div id="confirm-actions" class="flex items-center justify-end gap-3">
        <button id="close-anyway-btn" class="text-[#e07a7a] text-[13px] px-4 py-2.5 hover:text-[#f0a0a0]">Close anyway</button>
        <button id="cancel-btn" class="text-[#b8b8bc] text-[13px] px-4 py-2.5 border border-[#2c2c2f] rounded-md hover:text-[#f4f4f5] hover:border-[#7a7a80]">Cancel</button>
        <button id="export-btn" class="bg-[#FFD60A] text-[#0e0e10] text-[13px] font-medium px-5 py-2.5 rounded-md hover:bg-[#f2cc00] flex items-center gap-2 min-w-[112px] justify-center disabled:opacity-80 disabled:cursor-not-allowed">
          <i id="export-btn-spinner" class="fa-solid fa-spinner fa-spin text-[12px] hidden"></i>
          <span id="export-btn-label">Export first</span>
        </button>
      </div>
    </div>
  </div>

  </div>

</div>

<script>
  const exportBtn = document.getElementById('export-btn');
  const exportBtnLabel = document.getElementById('export-btn-label');
  const exportBtnSpinner = document.getElementById('export-btn-spinner');

  exportBtn.addEventListener('click', function () {
    if (exportBtn.disabled) return;
    exportBtn.disabled = true;
    exportBtnSpinner.classList.remove('hidden');
    exportBtnLabel.textContent = 'Exporting\u2026';
  });

  const sidebar = document.getElementById('sidebar');
  const collapseToggle = document.getElementById('collapse-toggle');
  collapseToggle.addEventListener('click', function () {
    sidebar.classList.toggle('collapsed');
  });
  const accountSwitcher = document.getElementById('account-switcher');
  accountSwitcher.addEventListener('click', function () {
    accountSwitcher.classList.toggle('bg-[#2a2a2e]');
  });
</script>

</body>
</html>
